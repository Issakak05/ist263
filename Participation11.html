
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Participation</title>
</head>
<body>

    <div id="school" onclick="changeText()">
        Syracuse University
    </div>

    <script>
        function changeText() {
            document.getElementById("school").innerHTML = "Orange Nation";
            document.getElementById("school").style.color = "orange";
        }
    </script>

</body>
</html>
